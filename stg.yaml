# 仅用于 stg 首次验证；应用使用独立的 DockerfileStg 构建。
# 构建时指定 -f DockerfileStg，并通过 --platform 选择与 stg 节点一致的平台。
# 在 stg 集群的 server 命名空间预先创建 new-api-stg-secret，包含非空的：
# SQL_DSN（new-api 独立数据库）、REDIS_CONN_STRING（独立实例或逻辑库）、SESSION_SECRET。
# 不要将真实连接串、密码或密钥提交到仓库。
# 镜像仓库沿用参考项目；首次发布前构建并推送下面的镜像标签。
# 私有仓库如需认证，在 Pod spec 中配置 stg 实际使用的 imagePullSecrets。
# 首次验证入口：kubectl --context <stg-context> -n server port-forward svc/new-api-stg 3000:3000
# 然后访问 http://localhost:3000；接入共享访问入口时再配置 HTTPS 与可信 Origin。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api-stg
  namespace: server
  labels:
    app: new-api-stg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: new-api-stg
  # 首次验证保持单实例，避免更新期间同时运行多个后台任务节点。
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: new-api-stg
    spec:
      # 应用默认允许进行中的请求在 120 秒内结束。
      terminationGracePeriodSeconds: 150
      containers:
        - name: new-api
          image: 10.37.5.104:1180/stg/new-api:stg-verify-001
          imagePullPolicy: IfNotPresent
          args: ["--log-dir", "/logs"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: TZ
              value: Asia/Shanghai
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api-stg-secret
                  key: SQL_DSN
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: new-api-stg-secret
                  key: REDIS_CONN_STRING
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api-stg-secret
                  key: SESSION_SECRET
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          # 首次验证的起始配额，后续按实际负载调整。
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: server-logs
              mountPath: /logs
      volumes:
        - name: server-logs
          hostPath:
            path: /home/k8slog/stg/new-api
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: new-api-stg
  namespace: server
  labels:
    app: new-api-stg
spec:
  type: ClusterIP
  selector:
    app: new-api-stg
  ports:
    - name: http
      port: 3000
      targetPort: http
