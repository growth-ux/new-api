apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldw-new-api
  namespace: server
  labels:
    app: ldw-new-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldw-new-api
  template:
    metadata:
      labels:
        app: ldw-new-api
    spec:
      imagePullSecrets:
        - name: stgadmin
      containers:
        - name: ldw-new-api
          # 占位镜像，发布时由同目录 jenkins-deploy.sh 替换为本次 tag。
          image: stgharbor.liangdawang.com:1180/stg/ldw-new-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: ldw-new-api-secret
---
apiVersion: v1
kind: Service
metadata:
  name: ldw-new-api
  namespace: server
  labels:
    app: ldw-new-api
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 32767
  selector:
    app: ldw-new-api
